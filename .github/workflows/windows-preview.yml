name: Build Windows installer
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'tests/**'
      - 'dist/converter.js'
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser converter
        run: node tests/converter.test.cjs
      - name: Compile and test Windows converter
        shell: powershell
        run: .\desktop\build.ps1
      - name: Write checksums
        shell: powershell
        run: |
          Get-ChildItem desktop/out/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content desktop/out/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Harf-Windows-preview
          path: desktop/out/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish preview installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.1.0-preview.${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" desktop/out/Harf.exe desktop/out/Harf-Setup.exe desktop/out/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Harf Windows preview ${{ github.run_number }}" --notes-file .github/preview-notes.md
